<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecKit</title>
</head>
<body>
    <header>
        <h1>SecKit</h1>
    </header>
    <main>
        <section>
            <h2>Генератор паролей</h2>
            <form>
                <label>Длина<input type="number" min="8" max="128"></label>
                <fieldset>
                    <legend>Символы для создания пароля:</legend>
                    <label><input type="checkbox">Строчные</label>
                    <label><input type="checkbox">Заглавные</label>
                    <label><input type="checkbox">Цифры</label>
                    <label><input type="checkbox">Спецсимволы</label>
                </fieldset>
                <button>Сгенерировать</button>
                <output></output>
            </form>
        </section>
        <section>
            <h2>Проверка стойкости</h2>
            <form>
                <label>Пароль<input type="password"></label>
            <output></output>
            </form>
        </section>
    </main>
    <footer>
        <a href="https://github.com/Soerxq/seckit-learn-frontend" target="_blank">GitHub-репозиторий</a>
    </footer>
</body>
</html>
