<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecKit</title>
</head>
<body>
    <header>
        <h1>SecKit</h1>
    </header>
    <main>
        <section>
            <h2>Генератор паролей</h2>
            <label><input type="number">длина</label><br>
            <label><input type="checkbox">строчные</label><br>
            <label><input type="checkbox">заглавные</label><br>
            <label><input type="checkbox">цифры</label><br>
            <label><input type="checkbox">спецсимволы</label><br>
            <button>Сгенерировать</button><br>
            <hr>
            <output>test</output>
        </section>
        <section>
            <h2>Проверка стойкости</h2>
            <label><input type="text" placeholder="Введите ваш пароль">Пароль</label><br>
            <hr>
            <output>test</output>
        </section>
    </main>
    <footer>
        <a href="https://github.com/Soerxq/seckit-learn-frontend" target="_blank">GitHub-репозиторий</a>
    </footer>
</body>
</html>
